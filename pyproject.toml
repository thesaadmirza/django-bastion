[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-bastion"
version = "0.0.1a1"
description = "Enterprise SSO and identity governance for Django: admin login, claims-to-role mapping, audit, and break-glass."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Saad Mirza" }]
keywords = ["django", "sso", "oidc", "saml", "scim", "audit", "identity", "authentication"]

# Runtime dependencies stay loose. A library that pins is unusable in an enterprise.
#
# `cryptography` is not optional. OIDC is the default protocol, `connections.py`
# imports it unconditionally, and the system checks reach that on every
# `manage.py` invocation -- so a base install without it cannot even run
# `manage.py check`. It ships wheels for every platform we support, unlike the
# SAML stack, which is why that one stays an extra.
dependencies = [
    "Django>=5.2",
    "cryptography>=44.0",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Empty on purpose. OIDC support is in the base install, so `[oidc]` adds
# nothing -- it is kept only so an install line that already says it keeps
# working. There is deliberately no JOSE library: see
# src/bastion/protocols/oidc for why.
oidc = []

# SAML is opt-in because it drags in xmlsec, which needs system packages, and
# the common case does not need it.
saml = ["pysaml2>=6.5.0"]
ldap = ["django-auth-ldap>=4.8", "python-ldap>=3.4.5"]
scim = []

[project.urls]
Homepage = "https://github.com/thesaadmirza/django-bastion"
# The docs tree in the repository, not a Read the Docs project. There is no
# such project, and a dead link on the PyPI page is worse than an unglamorous
# live one. Point this at Read the Docs on the day it exists.
Documentation = "https://github.com/thesaadmirza/django-bastion/blob/main/docs/index.md"
Changelog = "https://github.com/thesaadmirza/django-bastion/blob/main/CHANGELOG.md"
Issues = "https://github.com/thesaadmirza/django-bastion/issues"
Security = "https://github.com/thesaadmirza/django-bastion/blob/main/SECURITY.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    # The synthetic IdP mints tokens at the byte level, including shapes a
    # correct JOSE library refuses to serialise. It needs raw primitives.
    "cryptography>=44.0",
    "mypy>=1.14",
    "django-stubs[compatible-mypy]>=5.1",
    "pyright>=1.1.390",
    "ruff>=0.9",
    "nox>=2024.10",
    "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bastion"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/CHANGELOG.md", "/SECURITY.md", "/SUPPORT_MATRIX.md"]

# --------------------------------------------------------------------------- #
# Lint
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "S",         # bandit
    "DTZ",       # naive datetimes -- audit records must be tz-aware
    "T20",       # no print()
    "RUF",
]
ignore = [
    "S101",      # assert is fine in tests; banned in src by the check below
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "DTZ"]
# Demo scripts whose entire output is printed to a terminal.
"tests/manual_check_demo.py" = ["T201", "E402"]
"tests/manual_doctor_demo.py" = ["T201", "E402", "BLE001"]
# Runs standalone against an installed wheel, so settings must be configured
# before any bastion import and progress goes to stdout. Both are the point.
"tests/smoke_installed.py" = ["T201", "E402"]
# Generated by Django. Reformatting them creates diff noise on every
# makemigrations and gains nothing.
"src/bastion/migrations/*" = ["ALL"]
# RUF012 wants ClassVar on mutable class attributes. Django's Meta inner class
# is exactly that by design, and annotating it breaks the ORM's introspection.
"src/bastion/models.py" = ["RUF012"]
"src/bastion/audit/models.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["bastion", "tests"]

[tool.ruff.lint.flake8-bandit]
# `assert` must never guard a runtime invariant in the auth path -- it vanishes
# under `python -O`, turning a check into no check on the deployments most
# likely to be tuned for performance.
check-typed-exception = true

# --------------------------------------------------------------------------- #
# Types
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

# Zone 1: the pure-Python security core. No Django dynamism, no excuse.
[[tool.mypy.overrides]]
# The pure-Python security core. `bastion.rules.*` joins this list when the
# rule engine lands; listing a module that does not exist makes mypy warn about
# an unused section, so it is added with the code rather than ahead of it.
module = ["bastion.claims.*", "bastion.protocols.*", "bastion.audit.*"]
strict = true

# Zone 2: models, admin, migrations. Relaxed because Django's descriptors defeat
# strict mode without the plugin resolving every manager and reverse accessor.
[[tool.mypy.overrides]]
module = ["bastion.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pyright]
# Advisory, not a merge gate. Pyright does NOT load the mypy plugin, so this job
# exists to prove our public API is usable by the (large) pyright/Pylance
# population who see only the static stubs.
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.11"

# --------------------------------------------------------------------------- #
# Test
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
# Without this, `tests.settings` is only importable when pytest is started as
# `python -m pytest`, which puts the working directory on sys.path. A bare
# `pytest`, which is what CI and most editors run, does not, and pytest-django
# fails to import the settings module before collection begins.
pythonpath = ["."]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["bastion"]

[tool.coverage.report]
fail_under = 95
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
