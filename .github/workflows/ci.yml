name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege at the top; jobs opt in to more if they need it.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

# Every action is referenced by full commit SHA, with the tag kept in a
# trailing comment for humans. A tag is mutable: the tj-actions/changed-files
# and trivy-action compromises both worked by moving one. Renovate (see
# .github/renovate.json5) bumps the SHA and the comment together.

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv run --group dev ruff check src tests noxfile.py
      - run: uv run --group dev ruff format --check src tests noxfile.py
      - name: No assert in the auth path
        # assert vanishes under `python -O`. mozilla-django-oidc-db guards
        # runtime invariants with bare asserts; we will not.
        run: |
          ! grep -rn --include='*.py' -E '^\s*assert ' src/
      - name: No verification-disabling flags outside tests
        # `strict=False` was in this list and does not belong: the only use in
        # the tree is ipaddress.ip_network(net, strict=False), where it permits
        # host bits in a CIDR and disables no checking at all. A guard that
        # cries wolf on correct code gets switched off, so it names only flags
        # that mean what it says.
        run: |
          ! grep -rn --include='*.py' -E 'verify\s*=\s*False|insecure\s*=\s*True|check_hostname\s*=\s*False|# ?nosec' src/

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run --group dev mypy src

  typecheck-pyright:
    # Advisory: proves the public API is usable without the mypy plugin.
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run --group dev pyright src

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        django: ["5.2", "6.0", "6.1"]
        exclude:
          # Django 6.x requires Python 3.12+
          - python: "3.11"
            django: "6.0"
          - python: "3.11"
            django: "6.1"
    name: py${{ matrix.python }} / dj${{ matrix.django }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python }}
      # `==X.Y.*` rather than `~=X.Y.0`, because 6.1 is not released and only
      # 6.1rc1 exists. `~=6.1.0` expands to `>=6.1.0`, and 6.1rc1 sorts before
      # 6.1.0, so the lower bound excluded it however the prerelease flag was
      # set. Prefix matching takes the rc and the eventual 6.1.x alike.
      #
      # The classifiers claim Django 6.1, so this cell is what makes that true
      # rather than aspirational, and an rc is a cheaper place to find breakage
      # than release day.
      - run: >-
          uv run --prerelease=allow --with "Django==${{ matrix.django }}.*"
          --group dev pytest --cov=bastion

  tests-databases:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, mysql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: bastion
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: bastion
          MYSQL_DATABASE: bastion
        options: >-
          --health-cmd "mysqladmin ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["3306:3306"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      # Through nox, not pytest directly: the database drivers are installed by
      # the tests_db session and are deliberately absent from the dev group, so
      # calling pytest here fails to import psycopg before it runs a test.
      - run: uv run --group dev nox -s "tests_db(database='${{ matrix.database }}')"

  coverage-core:
    # The security core carries a 100% gate. The rest of the repo is 95%.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run --group dev nox -s coverage_core

  migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: No missing migrations
        run: uv run --group dev nox -s migrations

  wheel-sanity:
    # Builds the wheel, installs it clean, and proves py.typed survived.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run --group dev nox -s wheel_sanity

  workflow-audit:
    # zizmor catches template injection and unpinned actions in our own CI.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uvx zizmor --format sarif . > zizmor.sarif
      - uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: zizmor.sarif
