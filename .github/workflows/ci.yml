name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege at the top; jobs opt in to more if they need it.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

# Every action is referenced by full commit SHA, with the tag kept in a
# trailing comment for humans. A tag is mutable: the tj-actions/changed-files
# and trivy-action compromises both worked by moving one. Renovate (see
# .github/renovate.json5) bumps the SHA and the comment together.

jobs:
  dco:
    # Every commit in a pull request carries a Developer Certificate of Origin
    # sign-off from its own author. CONTRIBUTING asked for this for a long time
    # and nothing checked it, which is the failure mode this repository keeps
    # writing tests about: a control that reads as present and enforces nothing.
    #
    # Done with git rather than a third-party action on purpose. The whole check
    # is fifteen lines of shell, and a supply-chain dependency in the CI of a
    # security package should have to earn its place.
    #
    # Only on pull requests: a push to main has no base to diff against, and the
    # history predating this job is unsigned and stays that way. Nothing is
    # certified retroactively.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The whole range has to be present to walk it.
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit is signed off by its author
        shell: bash
        # Through the environment, never interpolated into the script: a ref
        # name is attacker-controlled on a fork PR, and zizmor rejects the
        # template-injection shape.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Merge commits are GitHub's, not a contributor's certification, so
          # they are excluded. Everything else has to carry a Signed-off-by
          # trailer whose value is that commit's own author -- a sign-off in
          # somebody else's name certifies nothing.
          missing=0
          while read -r sha; do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" |
              grep -qixF "$author"; then
              continue
            fi
            echo "::error::${sha} is not signed off by its author, ${author}"
            git show -s --format='  %h %s' "$sha"
            missing=$((missing + 1))
          done < <(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")

          if [ "$missing" -ne 0 ]; then
            echo
            echo "${missing} commit(s) need a Signed-off-by trailer matching the author."
            echo "Add it to new commits with 'git commit -s', or to the ones already"
            echo "written with 'git rebase --signoff ${BASE_SHA}' and a force-push."
            echo "See CONTRIBUTING.md and https://developercertificate.org/."
            exit 1
          fi
          echo "Every commit in ${BASE_SHA}..${HEAD_SHA} is signed off."

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv run --group dev ruff check src tests noxfile.py
      - run: uv run --group dev ruff format --check src tests noxfile.py
      - name: No assert in the auth path
        # assert vanishes under `python -O`. mozilla-django-oidc-db guards
        # runtime invariants with bare asserts; we will not.
        run: |
          ! grep -rn --include='*.py' -E '^\s*assert ' src/
      - name: No verification-disabling flags outside tests
        # `strict=False` was in this list and does not belong: the only use in
        # the tree is ipaddress.ip_network(net, strict=False), where it permits
        # host bits in a CIDR and disables no checking at all. A guard that
        # cries wolf on correct code gets switched off, so it names only flags
        # that mean what it says.
        run: |
          ! grep -rn --include='*.py' -E 'verify\s*=\s*False|insecure\s*=\s*True|check_hostname\s*=\s*False|# ?nosec' src/

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run --group dev mypy src

  typecheck-pyright:
    # Advisory: proves the public API is usable without the mypy plugin.
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run --group dev pyright src

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        django: ["5.2", "6.0", "6.1"]
        exclude:
          # Django 6.x requires Python 3.12+
          - python: "3.11"
            django: "6.0"
          - python: "3.11"
            django: "6.1"
    name: py${{ matrix.python }} / dj${{ matrix.django }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python }}
      # `==X.Y.*` rather than `~=X.Y.0`, because 6.1 is not released and only
      # 6.1rc1 exists. `~=6.1.0` expands to `>=6.1.0`, and 6.1rc1 sorts before
      # 6.1.0, so the lower bound excluded it however the prerelease flag was
      # set. Prefix matching takes the rc and the eventual 6.1.x alike.
      #
      # The classifiers claim Django 6.1, so this cell is what makes that true
      # rather than aspirational, and an rc is a cheaper place to find breakage
      # than release day.
      - run: >-
          uv run --prerelease=allow --with "Django==${{ matrix.django }}.*"
          --group dev pytest --cov=bastion

  tests-databases:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, mysql, mariadb]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: bastion
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: bastion
          MYSQL_DATABASE: bastion
        options: >-
          --health-cmd "mysqladmin ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["3306:3306"]
      # The floor rather than something current, because the floor is the
      # version most likely to break. This job installs the newest supported
      # Django, so the floor is whatever that Django enforces: 6.1 raised it
      # from 10.6 to 10.11, and 10.6 then failed every run here without a
      # single line of this package changing. A test pins the two together.
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: bastion
          MARIADB_DATABASE: bastion
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["3307:3306"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      # Through nox, not pytest directly: the database drivers are installed by
      # the tests_db session and are deliberately absent from the dev group, so
      # calling pytest here fails to import psycopg before it runs a test.
      - run: uv run --group dev nox -s "tests_db(database='${{ matrix.database }}')"

  coverage-core:
    # The security core carries a 100% gate. The rest of the repo is 95%.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run --group dev nox -s coverage_core

  migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: No missing migrations
        run: uv run --group dev nox -s migrations

  wheel-sanity:
    # Builds the wheel, installs it clean, and proves py.typed survived.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run --group dev nox -s wheel_sanity

  workflow-audit:
    # zizmor catches template injection and unpinned actions in our own CI.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uvx zizmor --format sarif . > zizmor.sarif
      - uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: zizmor.sarif
